<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}War Simulator{% endblock %}</title>
  <style>
    :root { --blue:#2563eb; --red:#dc2626; --bg:#f3f4f6; --text:#1f2937; --muted:#6b7280; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    header { background: #111827; padding: 14px 24px; display: flex; gap: 20px; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    header .brand { font-size: 1.2rem; margin-right: auto; }
    main { max-width: 800px; margin: 24px auto; padding: 0 16px; }
    h1, h2 { margin: 0 0 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 12px 16px; margin-bottom: 12px; }
    .unit-card { display: flex; align-items: center; gap: 14px; cursor: pointer; transition: transform .1s, box-shadow .1s; }
    .unit-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.15); }
    .unit-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .info { flex: 1; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: .75rem; font-weight: 600; }
    .badge.Blue { background: var(--blue); }
    .badge.Red { background: var(--red); }
    .muted { color: var(--muted); font-size: .85rem; }
    .bar { background: #e5e7eb; border-radius: 6px; height: 8px; margin-top: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: #22c55e; }
    button { background: #111827; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .9rem; }
    button:hover { opacity: .85; }
    .btn-heal { background: #16a34a; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .msg.success { background: #dcfce7; color: #166534; }
    form p { margin: 0 0 12px; }
    form label { display: block; font-weight: 600; margin-bottom: 4px; }
    form input, form select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; }
    .errorlist { color: #b91c1c; list-style: none; padding: 0; margin: 0 0 4px; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'unit_list' %}">War Simulator</a>
    <a href="{% url 'unit_list' %}">Units</a>
    <a href="{% url 'unit_create' %}">Add unit</a>
  </header>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
